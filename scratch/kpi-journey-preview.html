<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>KPI Journey Preview</title><style>body{margin:0;padding:28px;background:#f7f8fc;font-family:Arial,sans-serif}main{max-width:1260px;margin:auto}button{cursor:pointer}*{box-sizing:border-box}</style></head><body><main><p style="font-size:11px;color:#8b7ba3">DEVELOPMENT PREVIEW · Synthetic data</p><div class="kj-toolbar" style="margin-bottom:24px"><h2>Pioneer Center</h2><div class="kj-tabs"><button data-view="journey" aria-selected="true">Journey</button><button data-view="points" aria-selected="false">Points</button><button id="theme">Dark mode</button><button id="mobile">Mobile preview</button></div></div><div id="content"></div></main><script type="module">
import '/src/style.css';
import '/src/components/kpiJourney.css';
import {calculateMetrics} from '/src/utils/kpiMetrics.js';
import {renderKPIJourney,renderKPIPoints} from '/src/components/KPIJourney.js';
const rows=[];
for(let day=1;day<=18;day++){if(day===11)continue;const date='2026-09-'+String(day).padStart(2,'0'); const net=day%4===0?80000:day%3===0?53000:66000;rows.push({channelId:'dinein',branchId:'Pioneer Center',date,orders:80,financials:{net},hourlyNet:{'09':net*.45,'18':net*.55},breakdown:{kpi:day===8?{}:{drinkOrders:day%3===0?20:45}}});rows.push({channelId:'grabfood',branchId:'Pioneer Center',date,orders:100});}
const target={shift1:26000,shift2:35000,avo:750,drink:50,incident:.25,monthlyNet:1700000,shift1Time:'7:00 - 16:00',shift2Time:'17:00 - 1:00'};
const metrics=calculateMetrics(rows,target,{incidentAvailable:true,adjustments:[],dailyTarget:65000});let view='journey',selectedDate='2026-09-18',filters={};
const render=()=>{document.querySelector('#content').innerHTML=view==='journey'?renderKPIJourney(metrics,{year:2026,month:9,selectedDate,today:'2026-09-19'}):renderKPIPoints(metrics,filters);document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===view));};
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.view)view=d.view;else if(d.kpiDay){selectedDate=d.kpiDay;view='journey';}else if(d.kpiPointsDate){view='points';filters={date:d.kpiPointsDate,kind:'daily'};}else if(d.kpiPointsPage!==undefined)filters.page=+d.kpiPointsPage;else if(d.kpiPointsReset!==undefined)filters={};else if(b.id==='theme')document.documentElement.classList.toggle('dark');else if(b.id==='mobile'){const main=document.querySelector('main');main.style.maxWidth=main.style.maxWidth==='390px'?'1260px':'390px';}render();});
document.addEventListener('change',event=>{if(event.target.dataset.kpiPointFilter){filters[event.target.dataset.kpiPointFilter]=event.target.value;filters.page=0;render();}});render();
</script></body></html>
